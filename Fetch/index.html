<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Github</title>
    <script>
        const URL="https://dummyjson.com/products";
        const RATEURL="https://v6.exchangerate-api.com/v6/615b1ef074dfff6412221625/pair/USD/INR";

        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        async function loadProduct(){
            try{
                const res=await fetch(URL)
                const data=await res.json();
                const RateUrl=await fetch(RATEURL);
                const rate = await RateUrl.json();
                const rateXXX = rate.conversion_rate;
                console.log(rateXXX)
                // console.log(data)
                const ele=document.querySelector("tbody")
                data.products.forEach((product,idx)=>{
                    const tr = document.createElement("tr");
                    tr.innerHTML =`
                        <td>${idx+1}</td>
                        <td>${product.title}</td>
                        <td>${product.category}</td>

                        <td> ${(((product.price))*rateXXX).toFixed(2)} ₹</td>
                        <td>${product.rating}</td>
                        <td><img src='${product.thumbnail}' width="80"></td>
                        <td><button onclick="addToCart('${product.title}')">Add To Cart</button></td>
                        `;
                        
                        ele.appendChild(tr);
                });

                }
            catch(err){
                console.log("Error",err);
            }
        }

        function addToCart(title){
            cart.push(title);
           

            // Save to local storage
            localStorage.setItem("cart",JSON.stringify(cart));
             alert(title +" Added To cart");
        }

        function placeOrder(){
            if(cart.length===0){
                alert("Cart is empty");
            }
            else {
                alert("Order placed for :",+ cart.join(" , "));
                cart=[];
                  localStorage.removeItem("cart"); // clear storage
            }
        }
       

        loadProduct();

    </script>
    <style>
        table{
            margin: auto;
            background-color:antiquewhite;

        }
       
    </style>
</head>
<body>
    <table border="1">
        <thead class="x">
            <tr>
            <th>idx</th>
            <th>Title</th>
            <th>Category</th>
            <th>Price</th>
            <th>Rating</th>
            <th>image</th>
            <th>Choose</th>
            
        </tr>
        </thead>
        <tbody>

        </tbody> 

    </table>
     <div style="text-align:center; margin-top:10px;">
        <button onclick="placeOrder()">Place Order</button>
    </div>
        
</body>
</html>
